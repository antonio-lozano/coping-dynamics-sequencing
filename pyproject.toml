[project]
name = "coping-dynamics-sequencing"
version = "1.0.0"
description = "Reproducible manuscript figures and statistical outputs for coping dynamics sequencing."
readme = "README.md"
# 3.9 reached end of life in October 2025; the locked interpreter is 3.11.
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
authors = [
  { name = "Jeniffer Sanguino Gomez" },
  { name = "Antonio Lozano" },
]
dependencies = [
  "numpy>=1.21.0,<2.0.0",
  "pandas>=1.3.0,<3.0.0",
  "scipy>=1.7.0,<2.0.0",
  "openpyxl>=3.1.0,<4.0.0",
  "python-docx>=0.8.11,<2.0.0",
  "matplotlib>=3.4.0,<4.0.0",
  "seaborn>=0.11.0,<1.0.0",
  "pillow>=9.0.0,<13.0.0",
  "imageio>=2.30.0,<3.0.0",
  "imageio-ffmpeg>=0.5.0,<1.0.0",
  "pymupdf>=1.24.0,<2.0.0",
  "networkx>=3.0.0,<4.0.0",
  "statsmodels>=0.13.0,<1.0.0",
  "scikit-learn>=1.0.0,<2.0.0",
  "xgboost>=1.7.0,<3.0.0",
  "joblib>=1.1.0,<2.0.0",
  # Supplementary Figure 5 draws the legacy class-specific SHAP beeswarms.
  "shap>=0.41.0,<1.0.0",
]

[project.scripts]
behavior-classifier = "coping_dynamics.behavior_classifier.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0,<9.0.0",
  # Same version as .pre-commit-config.yaml so the hook and `uv run ruff` agree.
  "ruff==0.15.6",
  "pre-commit>=4.0.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coping_dynamics"]

# PyPI-style distributions provide the library/CLI, not the study checkout or
# companion runtimes. An allowlist also excludes local tracking environments.
[tool.hatch.build.targets.sdist]
only-include = ["coping_dynamics", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: rebuilds real artifacts (workbooks, figures); run explicitly or in the CI pipeline job",
]

[tool.ruff]
line-length = 100
# The vendored tool manages its own environment and style; the archive folder is
# not part of the repository.
extend-exclude = ["apps", "tools", "_archive_main"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Entry points set matplotlib's backend and the import path before importing
# repository modules, so some imports cannot sit at the top of the file.
"scripts/**" = ["E402"]
"behavior_classifier.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["coping_dynamics", "scripts"]
