# Project definitions (do not edit)
Task: Freezing_07-2020
scorer: Sanguino-Lozano
date: Sep29

# Project path.
# This is rewritten automatically at run time to point at wherever this
# project folder currently lives, so the value below is only a placeholder.
project_path: .

# Annotation data set configuration (and individual video cropping parameters)
# The original labelled video set is not distributed with this bundle. It is
# only needed to retrain or refine the network, not to analyse new videos.
video_sets: {}
bodyparts:
- nose
- H1R
- H2R
- H1L
- H2L
- B1R
- B2R
- B3R
- B1L
- B2L
- B3L
- tail
- S2
- S1

start: 0
stop: 1
numframes2pick: 20

# Plotting configuration
skeleton:
- - nose
  - S1
  - S2
  - tail
- - nose
  - H1R
  - H2R
  - B1R
  - B2R
  - B3R
  - tail
- - nose
  - H1L
  - H2L
  - B1L
  - B2L
  - B3L
  - tail
skeleton_color: yellow
pcutoff: 0.8
dotsize: 5
alphavalue: 0.7
colormap: jet

# Training,Evaluation and Analysis configuration
TrainingFraction:
- 0.9
# Iteration 1 is the network behind the published freezing and behaviour
# analyses (DLC_resnet50_Freezing_07-2020Sep29shuffle1_100000). Iteration 0
# (snapshot-500000) is kept in dlc-models/ and produced the bundled demo
# tracking files; set this back to 0 to reproduce those.
iteration: 1
resnet:
snapshotindex: -1
batch_size: 32

# Cropping Parameters (for analysis and outlier frame detection)
cropping: false
#if cropping is true for analysis, then set the values here:
x1: 0
x2: 640
y1: 277
y2: 624

# Refinement configuration (parameters from annotation dataset configuration also relevant in this stage)
corner2move2:
- 50
- 50
move2corner: true
default_net_type: resnet_50
default_augmenter: default
