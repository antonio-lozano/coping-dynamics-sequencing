# Local guards for hand-written sources.
#
# Every mutating hook excludes the generated artifact trees and the vendored
# tool: a formatter that rewrites bytes hashed by MANIFEST.csv would break the
# reproducibility contract, and apps/ manages its own environment and style.
# Research artifacts already tracked are retained; new large assets belong in data releases.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
        exclude: &generated ^(figures/|figure_source_data/|statistics/|data/|report/|classifier/|supplementary_media/|apps/|tools/|MANIFEST\.csv$|uv\.lock$)
      - id: check-toml
        exclude: *generated
      - id: check-json
        exclude: *generated
      - id: end-of-file-fixer
        exclude: *generated
      - id: trailing-whitespace
        exclude: *generated
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
        exclude: *generated
      - id: ruff-format
        exclude: *generated
