# Deploys the project page (docs/web/) to GitHub Pages. The site is assembled
# in CI: the committed page plus the README media, the grid-view video and the
# four vector figures it links, so no artifact bytes are duplicated in the
# repository.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# Runs on pushes to main. The pre-merge branch is listed too so the page can be
# deployed before the merge; that also needs the branch allowed under Settings ->
# Environments -> github-pages, which restricts deployments to the default branch
# out of the box. Drop the branch from the list once it has been merged.
name: pages

on:
  push:
    branches: [main, chore/tier2-tests-packaging]
    paths:
      - "docs/web/**"
      - "docs/media/**"
      - "figures/*.pdf"
      - "supplementary_media/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/media _site/figures
          cp -r docs/web/. _site/
          cp docs/media/*.gif docs/media/*.png _site/media/
          cp figures/figure3.pdf figures/figure4.pdf figures/figure5.pdf figures/figure6.pdf _site/figures/
          cp supplementary_media/Supplementary_Video_1_MoSeq_syllable_atlas_grid.mp4 _site/media/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
