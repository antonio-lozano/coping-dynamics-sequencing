name: Reproducibility checks

on:
  push:
  pull_request:

jobs:
  # Source hygiene and metadata: hooks, lockfile freshness, citation file.
  guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.10"

      - name: Lockfile matches pyproject
        run: uv lock --check

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Validate citation metadata
        run: uvx cffconvert@2.0.0 --validate

  # The locked environment installs, imports, and passes the layout checks and
  # the fast test suite, on both operating systems the repository documents.
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.10"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      - name: Import smoke check
        run: >
          uv run python -c "import matplotlib, numpy, openpyxl, pandas, scipy,
          shap, sklearn, statsmodels, xgboost; import coping_dynamics.config"

      - name: Compile every Python file
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import py_compile
          for path in Path('.').rglob('*.py'):
              if '.git' in path.parts or '.venv' in path.parts:
                  continue
              py_compile.compile(str(path), doraise=True)
          PY

      - name: Check publication artifact layout
        run: uv run python scripts/check_reproducibility.py

      - name: Check manuscript, figures and report agree
        run: uv run python scripts/check_manuscript.py

      - name: Fast test suite
        run: uv run pytest -m "not slow" -q
