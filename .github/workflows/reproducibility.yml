name: Software checks

on:
  push:
  pull_request:

jobs:
  # Source hygiene and metadata: hooks, lockfile freshness, citation file.
  guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.10"

      - name: Lockfile matches pyproject
        run: uv lock --check

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Validate citation metadata
        run: uvx cffconvert@2.0.0 --validate

  software:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.10"
      - name: Install macOS OpenMP runtime
        run: brew install libomp
      - run: uv sync --locked
      - name: Import smoke
        run: uv run python -c "import coping_dynamics, numpy, pandas, matplotlib, scipy, sklearn, statsmodels, xgboost, shap"
      - name: Compile maintained Python sources
        run: uv run python -m compileall -q coping_dynamics scripts apps/behavior-dlc-classifier/src
      - name: Artifact integrity
        run: uv run python scripts/check_reproducibility.py
      - name: Fast research tests
        run: uv run pytest -m "not slow" -q
      - name: Install app test dependencies
        working-directory: apps/behavior-dlc-classifier
        run: uv sync --locked --extra video --extra ml --extra dev
      - name: App tests
        working-directory: apps/behavior-dlc-classifier
        run: uv run --no-sync pytest -q
