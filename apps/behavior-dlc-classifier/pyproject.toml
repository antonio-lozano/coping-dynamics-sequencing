[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-dlc-classifier"
version = "0.1.0"
description = "Classify mouse behaviors (Freezing, Sniffing, Grooming, Turn, Locomotion, Climbing, Jump) from DeepLabCut tracking, summarize results, and annotate videos."
readme = "GUIDE.md"
requires-python = ">=3.9,<3.13"
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0,<3.0",
  "joblib>=1.3",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
  # The behavior model ships in the version-portable JSON format, which XGBoost
  # 2.0 and later reload exactly. 1.7 accepts the file but cannot recover the
  # class count from it and returns a transposed probability array, so 2.0 is a
  # correctness floor rather than a convention.
  "xgboost>=2.0,<4.0",
]

[project.optional-dependencies]
video = ["opencv-python>=4.8"]
# The shipped freezing models were written by scikit-learn 1.7. Predictions were
# verified identical to the bit under 1.6.1, 1.7.2 and 1.8.0.
ml = ["scikit-learn>=1.6,<1.9"]
dev = ["pytest>=7.0"]

[project.scripts]
freezing-dlc = "freezing_dlc.cli:main"
freezing-dlc-gui = "freezing_dlc.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
