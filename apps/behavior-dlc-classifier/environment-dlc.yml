# DeepLabCut environment, for tracking new videos with the bundled network.
#
#   conda env create -f environment-dlc.yml
#   conda activate dlc-freezing
#
# The tool itself is not installed here and does not need to be. It starts
# DeepLabCut in this environment through "conda run", so the name below is what
# goes in the interface's "DeepLabCut conda environment" field.
#
# DeepLabCut is kept out of the tool's own environment on purpose. It needs
# TensorFlow, whose supported Python and NumPy versions are years behind the
# rest of the stack, and conda is the route that installs it reliably on both
# Windows and Linux.
name: dlc-freezing
channels:
  - conda-forge
dependencies:
  # The newest Python that TensorFlow 2.10 supports.
  - python=3.10
  - pip
  # Video decoding for DeepLabCut, and for writing labeled videos.
  - ffmpeg
  - pip:
      # 2.3.x is the TensorFlow generation of DeepLabCut, which is what the
      # bundled ResNet-50 snapshot was trained with. DeepLabCut 3.x is
      # PyTorch-first and cannot read that snapshot.
      - "deeplabcut>=2.3,<3.0"
      # 2.10 is the last release with native GPU support on Windows. Pinning the
      # ceiling also keeps Windows and Linux on the same TensorFlow, which
      # resolves to 2.10.0 with NumPy 1.26.4 on both.
      - "tensorflow>=2.5,<=2.10"
