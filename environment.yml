name: coping-dynamics
channels:
  - conda-forge
  - defaults
dependencies:
  # Matches .python-version and the version the checks run on, so the conda,
  # uv and pip routes all land on the same interpreter. Anything from 3.9 to
  # 3.11 is supported.
  - python=3.11
  - numpy>=1.21
  - pandas>=1.3
  - matplotlib>=3.4
  - seaborn>=0.11
  - pillow>=9.0
  - imageio>=2.30
  - imageio-ffmpeg>=0.5
  - pymupdf>=1.24
  - networkx>=3.0
  - scipy>=1.7
  - openpyxl>=3.1
  - python-docx>=0.8.11
  - statsmodels>=0.13
  - scikit-learn>=1.0
  - xgboost>=1.7
  - joblib>=1.1
  # Supplementary Figure 5 draws the legacy class-specific SHAP beeswarms.
  - shap>=0.41
  - pip
